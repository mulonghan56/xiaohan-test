<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e7f4ff"><meta name="description" content="一个轻轻的蓝色访问测试页。"><title>小晗的测试页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf6fc;color:#25465e;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 10%,#fff 0,transparent 55%),#edf6fc}main{width:100%;max-width:480px;background:#ffffffdc;border:1px solid #fff;border-radius:32px;padding:42px 30px;box-shadow:0 20px 80px #648ba419;text-align:center}.tag{font-size:12px;letter-spacing:3px;color:#63869e}.cloud{width:110px;height:72px;margin:38px auto 28px}h1{font-size:28px;font-weight:600;letter-spacing:1px;margin:0 0 14px}p{font-size:15px;line-height:1.9;color:#708799;margin:0}.status{display:inline-flex;gap:8px;align-items:center;border-radius:24px;background:#eef8f3;color:#477a63;padding:9px 15px;font-size:13px;margin:24px 0}.dot{background:#6ba98b;width:7px;height:7px;border-radius:50%}button{display:block;width:100%;padding:16px;border:0;border-radius:17px;color:white;background:#5a8faf;font:inherit;cursor:pointer;margin:8px 0 16px}button:focus-visible{outline:3px solid #a3cbeb;outline-offset:4px}#result{min-height:29px;font-size:14px}footer{border-top:1px solid #e7eef3;margin-top:27px;padding-top:22px;font-size:12px;color:#899ca9;line-height:1.8}time{display:block;font-variant-numeric:tabular-nums}
</style>
<main><div class="tag">A LITTLE BLUE HELLO</div><svg class="cloud" viewBox="0 0 120 80" aria-hidden="true"><path d="M28 65C4 65 3 33 26 31C26 2 72-2 80 27C110 15 128 65 96 65Z" fill="#d7edfc"/><path d="M24 58C8 58 10 38 30 37C28 12 67 10 74 35C98 24 112 58 92 58Z" fill="white"/></svg><h1>小晗，网页打开啦</h1><p>一朵小云，来和你打个招呼。<br>这是我们的简单访问测试页。</p><div class="status"><span class="dot"></span>页面内容已加载</div><button id="test" type="button">点一下，测试互动</button><p id="result" role="status" aria-live="polite">看看这朵云有没有收到你的消息。</p><footer>设备当前时间<time id="clock"></time><span>文字、图形与互动均在页面内。</span></footer></main>
<script>const clock=document.querySelector('#clock');function tick(){clock.textContent=new Date().toLocaleString('zh-CN',{hour12:false})}tick();setInterval(tick,1000);let n=0;document.querySelector('#test').addEventListener('click',()=>{n++;document.querySelector('#result').textContent='收到啦，第 '+n+' 次点击。互动正常。'});</script>
</html>
